[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "ssa-rs"
version = "0.1.0"
description = "Rust-accelerated drop-in replacement for py-ssa-lib (SSA / MSSA)"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = ["numpy>=2.0.0", "pandas>=2.0.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.9.0"]

[tool.maturin]
python-source = "."
module-name = "ssa_rs._core"
features = ["pyo3/extension-module"]
