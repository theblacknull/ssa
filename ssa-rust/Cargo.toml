[package]
name = "ssa_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
faer = "0.24.4"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.12.0"
realfft = "3.5.0"
rustfft = "6"

[dev-dependencies]
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"

[profile.bench]
inherits = "release"
